<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메일 발송 — 셀라</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    if (localStorage.theme === "dark") {
      document.documentElement.classList.replace("light", "dark");
    }
  </script>
  <style>
    /* style.css 는 채팅 SPA 용이라 html, body 에 overflow:hidden 을 건다 — 표가 긴 이 페이지에선 되살린다 */
    html, body { height: auto; overflow: auto; }
  </style>
</head>
<body>
<main class="ms-page">
  <header class="ms-head"><h1>메일 발송</h1><span id="ms-me" class="ms-muted"></span></header>
  <section id="ms-connect" class="ms-card" hidden>
    <p id="ms-connect-msg"></p>
    <button id="ms-connect-btn" class="ms-btn">구글 연결 (메일 발송 권한)</button>
  </section>
  <section id="ms-main" class="ms-card" hidden>
    <label>스프레드시트 <select id="ms-book"></select></label>
    <label>시트 <select id="ms-sheet"></select></label>
    <label>보내는 주소 <select id="ms-sender"></select></label> <span id="ms-reply-to" class="ms-muted"></span>
    <p class="ms-muted">공용 주소가 없으면 Gmail 설정 → 계정 → '다른 주소에서 메일 보내기' 에 등록하세요.
      한 시트는 한 툴로만 보내세요 (기존 Apps Script 와 동시에 돌리지 마세요).</p>
    <p class="ms-muted">수신자별 첨부: 시트 1행에 '첨부' 열을 만들고(I열 이후) 행마다 Drive 링크를 적으세요 — 구글 문서는 PDF 로 붙습니다. 링크 파일은 내 계정에서 열 수 있어야 합니다.</p>
    <label>공통 첨부 (모든 수신자에게, 합계 15MB) <input type="file" id="ms-files" multiple></label>
    <span id="ms-files-info" class="ms-muted"></span>
    <button id="ms-check" class="ms-btn">점검</button>
  </section>
  <section id="ms-result" class="ms-card" hidden>
    <p id="ms-summary"></p>
    <ul id="ms-global-issues"></ul>
    <div id="ms-unknown-jobs"></div>
    <table class="ms-table"><thead><tr><th>행</th><th>담당자</th><th>이메일</th><th>상태</th><th>점검</th><th></th></tr></thead>
      <tbody id="ms-rows"></tbody></table>
    <button id="ms-send-all" class="ms-btn ms-btn-primary" disabled>전체 발송</button>
  </section>
  <section id="ms-job" class="ms-card" hidden>
    <p id="ms-job-text"></p><progress id="ms-job-bar" max="100" value="0"></progress>
    <p id="ms-job-err" class="ms-err"></p>
    <div id="ms-unknown" hidden>
      <p id="ms-unknown-text" class="ms-warn"></p>
      <button id="ms-ack" class="ms-btn">확인했음</button>
    </div>
    <button id="ms-stop" class="ms-btn">중지</button>
  </section>
  <dialog id="ms-preview"><h3 id="ms-pv-subject"></h3><p id="ms-pv-attach" class="ms-muted" hidden></p><div id="ms-pv-body"></div>
    <form method="dialog"><button class="ms-btn">닫기</button></form></dialog>
</main>
<script src="/static/mail_sender.js"></script>
</body>
</html>

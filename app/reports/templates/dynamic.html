<!doctype html>
<html lang="ko" data-report-ready="false">
<head>
<meta charset="utf-8">
<title>분석 보고서</title>
<style>
  :root{
    --ink:#16181d; --muted:#6b7280; --line:#e5e7eb; --bg:#fff;
    --accent:#1f6feb; --accent-soft:#dbeafe; --warn:#b45309; --warn-bg:#fffbeb;
    --up:#047857; --down:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.75 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:56px 32px 96px}
  h1{font-size:30px;line-height:1.35;letter-spacing:-.02em;margin:0 0 8px}
  h2{font-size:20px;letter-spacing:-.01em;margin:52px 0 6px;padding-top:26px;
    border-top:1px solid var(--line)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 8px}
  .lede{color:var(--muted);margin:0 0 36px}
  .q{background:#f9fafb;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
    padding:12px 16px;margin:0 0 32px;color:var(--muted);font-size:14px}
  .find{margin:14px 0 6px;padding:0;list-style:none}
  .find li{position:relative;padding-left:18px;margin:7px 0}
  .find li::before{content:"";position:absolute;left:4px;top:.72em;width:5px;height:5px;
    border-radius:50%;background:var(--accent)}
  table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f9fafb;font-weight:600;color:var(--muted);font-size:12px}
  tbody tr:hover{background:#fafafa}
  .scroll{overflow-x:auto}
  .up{color:var(--up)} .down{color:var(--down)}
  .bar{height:5px;background:#eef2f7;border-radius:3px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .chart{display:block;width:100%;height:auto;margin:16px 0 10px}
  .chart .ax{font-size:13px;fill:var(--muted);font-family:inherit}
  .find.vals{margin-top:10px}
  .find.vals li::before{background:var(--muted)}
  .find.vals .nm{font-weight:600}
  .find.vals .bar{margin:5px 0 0;max-width:340px}
  details.more{margin:-6px 0 8px}
  details.more>summary{cursor:pointer;color:var(--accent);font-size:13px;
    list-style:none;padding:4px 0}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"▸ "}
  details.more[open]>summary::before{content:"▾ "}
  .note{background:var(--warn-bg);border:1px solid #fde68a;border-left:3px solid var(--warn);
    border-radius:6px;padding:12px 15px;margin:14px 0;font-size:14px}
  .note b{color:var(--warn)}
  .foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13px}
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{font-size:11pt}
    h2{page-break-after:avoid} table{page-break-inside:avoid}
    .wrap{padding:0;max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <p class="lede" id="lede"></p>
  <div class="q" id="question"></div>
  <div id="sections"></div>
  <h2>산출 기준과 데이터 신뢰도</h2>
  <div id="quality"></div>
  <div class="foot" id="foot"></div>
</div>

<script type="application/json" id="report-payload">/*__PAYLOAD__*/</script>
<script>
const P = JSON.parse(document.getElementById('report-payload').textContent);

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtMetric(v, unit) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  if (unit === '억') return n.toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '억';
  return n.toLocaleString('ko-KR') + (unit || '');
}
function fmtPct(v) {
  if (v === null || v === undefined || v === '') return '—';
  return Number(v).toFixed(1) + '%';
}
function cell(row, col, unit) {
  const v = row[col.key];
  if (col.key === 'dim' && row.dim_full && row.dim_full !== v)
    return `<td title="${esc(row.dim_full)}">${esc(v)}</td>`;
  if (col.fmt === 'metric2') return `<td>${fmtMetric(v, col.unit)}</td>`;
  if (col.fmt === 'metric') {
    const cls = (col.key === 'delta' && Number(v) !== 0) ? (Number(v) > 0 ? 'up' : 'down') : '';
    return `<td class="${cls}">${fmtMetric(v, unit)}</td>`;
  }
  if (col.fmt === 'pct') {
    const cls = (col.key === 'growth' && v !== null) ? (Number(v) >= 0 ? 'up' : 'down') : '';
    return `<td class="${cls}">${fmtPct(v)}</td>`;
  }
  return `<td>${esc(v)}</td>`;
}

// 눈금을 사람이 읽는 값으로 올림. 1·2·5 만 쓰면 55.1억이 100억으로 올라가
// 차트 위 절반이 빈다 — 중간 단계를 둔다 (55.1 → 60).
const _NICE = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / e;
  return (_NICE.find(n => f <= n + 1e-9) || 10) * e;
}

/* 기간 추세 차트.
   ⛔ **바닥은 반드시 0이다.** 최솟값을 바닥에 붙이면 면적이 거짓말을 한다 —
      실제로 최저 6.6억(최고의 12%)이 0으로 보였다 (2026-08-13 사용자 지적).
   그리고 축이 없으면 어느 봉우리가 언제인지 알 수 없어 차트가 표의 장식이 된다. */
function trendChart(rows, unit) {
  const vals = rows.map(r => Number(r.value) || 0);
  if (vals.length < 2) return '';
  const top = niceMax(Math.max(...vals, 0));
  const W = 1000, H = 230, padL = 58, padR = 10, padT = 14, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const y0 = padT + plotH;                       // 0 선
  const yOf = v => y0 - (v / top) * plotH;
  const slot = plotW / vals.length;
  const bw = Math.min(slot * 0.62, 46);
  const peak = vals.indexOf(Math.max(...vals));

  // 눈금선 3개 (0 / 절반 / 최대) — 값을 왼쪽에 적는다
  const grid = [0, 0.5, 1].map(f => {
    const y = yOf(top * f);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"
              stroke="${f === 0 ? '#c9ced6' : '#eef1f5'}" stroke-width="1"/>
            <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end"
              class="ax">${fmtMetric(top * f, unit)}</text>`;
  }).join('');

  // 눈금이 빽빽하면 건너뛰되 첫·끝·최고점은 항상 적는다
  const step = vals.length <= 12 ? 1 : Math.ceil(vals.length / 9);
  const bars = rows.map((r, i) => {
    const v = vals[i], x = padL + slot * i + (slot - bw) / 2;
    const y = yOf(v), h = Math.max(y0 - y, v > 0 ? 1 : 0);
    const show = i % step === 0 || i === vals.length - 1 || i === peak;
    const lab = show
      ? `<text x="${(x + bw / 2).toFixed(1)}" y="${y0 + 20}" text-anchor="middle"
           class="ax">${esc(r.dim)}</text>` : '';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
              height="${h.toFixed(1)}" rx="2"
              fill="${i === peak ? 'var(--accent)' : 'var(--accent-soft)'}"
              stroke="var(--accent)" stroke-width="${i === peak ? 0 : 1}"><title>${esc(r.dim)} · ${
              esc(fmtMetric(v, unit))}</title></rect>${lab}`;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>`;
}

function bars(rows, key) {
  key = key || 'value';
  const max = Math.max(...rows.map(r => Math.abs(Number(r[key]) || 0)), 0);
  return rows.map(r => {
    const w = max ? Math.abs(Number(r[key]) || 0) / max * 100 : 0;
    return `<div class="bar"><i style="width:${w.toFixed(1)}%"></i></div>`;
  });
}

(function () {
  const M = P.meta;
  document.getElementById('title').textContent = M.title;
  document.getElementById('sub').textContent =
    `중점 ${M.params.focus_label} · 비교 ${M.params.compare_label} · 섹션 ${P.sections.length}개`;
  document.getElementById('lede').textContent = M.lede || '';
  document.getElementById('question').textContent = '질문: ' + M.question;

  const SHOW = 12;    // 표에 바로 보이는 행 수. 나머지는 접어 둔다 — 44행짜리 표는 읽히지 않는다
  const INLINE = 2;   // 이 행 수 이하는 표 대신 문장으로. 두 줄짜리 표는 표일 이유가 없다

  // 값 셀의 텍스트만 뽑는다 (표와 같은 포맷터를 쓰므로 숫자가 갈리지 않는다)
  function cellText(row, col, unit) {
    const d = document.createElement('div');
    d.innerHTML = cell(row, col, unit);
    return d.textContent.trim();
  }

  // 표를 문장으로 바꾸면서 **막대를 같이 잃어버렸다** (2026-08-13). 표 경로에만 막대가
  // 붙어 있어서 2행짜리 세 절의 차트가 조용히 사라졌다. 문장에도 비교 막대를 붙인다.
  function inlineRows(s) {
    const valCols = s.columns.filter(c => c.key !== 'dim');
    const barHtml = (s.chart === 'bar') ? bars(s.rows, s.chart_key) : null;
    return `<ul class="find vals">` + s.rows.map((r, i) => {
      const name = esc(r.dim);
      const parts = valCols.map(c => `${esc(c.label)} <b>${esc(cellText(r, c, s.unit))}</b>`);
      return `<li><span class="nm"${r.dim_full ? ` title="${esc(r.dim_full)}"` : ''}>${name}</span> — ${
        parts.join(' · ')}${barHtml ? barHtml[i] : ''}</li>`;
    }).join('') + `</ul>`;
  }

  document.getElementById('sections').innerHTML = P.sections.map(s => {
    const findHtml = `<ul class="find">${s.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
    const isTrend = (s.chart === 'line');
    const chartHtml = isTrend ? trendChart(s.rows, s.unit) : '';

    // 행이 둘 이하면 표를 만들지 않는다. total 은 발견 문장이 이미 두 기간을 말하므로 그것도 생략.
    if (s.rows.length <= INLINE) {
      const body = (s.block === 'total') ? '' : inlineRows(s);
      return `<h2>${esc(s.title)}</h2>${chartHtml}${findHtml}${body}`;
    }

    const barCol = (s.chart === 'bar');
    const cols = s.columns.concat(barCol ? [{key:'__bar', label:''}] : []);
    const barHtml = barCol ? bars(s.rows, s.chart_key) : [];
    const head = '<thead><tr>' + cols.map(c => `<th>${esc(c.label)}</th>`).join('') + '</tr></thead>';
    const tr = (r, i) => '<tr>' + cols.map(c =>
      c.key === '__bar' ? `<td>${barHtml[i]}</td>` : cell(r, c, s.unit)).join('') + '</tr>';
    // 추세 절은 차트가 18개월을 다 보여준다. 같은 값을 표로 또 깔면 화면만 길어진다 — 접어 둔다
    if (isTrend) {
      const all = `<div class="scroll"><table>${head}<tbody>${s.rows.map(tr).join('')}</tbody></table></div>`;
      return `<h2>${esc(s.title)}</h2>${chartHtml}${findHtml}` +
        `<details class="more"><summary>월별 수치 ${s.rows.length}행 보기</summary>${all}</details>`;
    }

    const head_rows = s.rows.slice(0, SHOW).map(tr).join('');
    const rest = s.rows.slice(SHOW);
    const table = `<div class="scroll"><table>${head}<tbody>${head_rows}</tbody></table></div>`;
    const more = rest.length
      ? `<details class="more"><summary>나머지 ${rest.length}행 보기</summary>
         <div class="scroll"><table>${head}<tbody>${rest.map((r, i) => tr(r, i + SHOW)).join('')}</tbody></table></div></details>`
      : '';
    return `<h2>${esc(s.title)}</h2>${chartHtml}${findHtml}${table}${more}`;
  }).join('');

  document.getElementById('quality').innerHTML = (P.quality_notes || []).map(n =>
    `<div class="note"><b>${esc(n.label)}</b> — ${esc(n.text)}</div>`).join('')
    + (M.skipped && M.skipped.length
        ? `<div class="note"><b>실린 내용에서 빠진 절</b> — ${esc(M.skipped.join(', '))}. 조회 결과가 없어 뺐습니다.</div>`
        : '');

  document.getElementById('foot').textContent =
    `조회 ${M.queries}회 · ${M.elapsed_sec}초 · 모든 수치는 조회 결과에서 왔고, 서술 문장은 규칙으로 생성됐습니다.`;

  document.documentElement.setAttribute('data-report-ready', 'true');
})();
</script>
</body>
</html>

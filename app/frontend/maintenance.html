<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKIN1004 AI Agent — 점검 중</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0e1420;
      color: #fff;
      font-family: 'Montserrat', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      text-align: center;
      padding: 40px 24px;
    }
    .logo {
      width: 100px;
      opacity: 0.85;
      margin-bottom: 40px;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e89200;
      margin-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.5;
      color: #fff;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 15px;
      color: #7a8a9a;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #243040;
      border-top-color: #e89200;
      border-radius: 50%;
      margin: 0 auto 40px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      font-size: 11px;
      color: #2a3a4a;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/static/splash-dark-new.png" alt="SKIN1004 AI Agent" onerror="this.style.display='none'">
    <div class="label">잠시만 기다려 주세요</div>
    <div class="title">데이터를 업데이트하고 있습니다</div>
    <div class="sub">
      BigQuery 데이터 동기화가 진행 중입니다.<br>
      완료 후 자동으로 정상 접속됩니다.
    </div>
    <div class="spinner"></div>
    <div class="footer">SKIN1004 AI Agent &nbsp;·&nbsp; Cella Enterprise</div>
  </div>
  <script>
    // 30초마다 서버 상태 확인 → 정상이면 자동 새로고침
    setInterval(function() {
      fetch('/safety/status').then(function(r){ return r.json(); }).then(function(d){
        if (!d.maintenance || !d.maintenance.active) location.reload();
      }).catch(function(){});
    }, 30000);
  </script>
</body>
</html>

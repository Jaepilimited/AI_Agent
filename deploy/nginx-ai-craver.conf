# AI Craver — Web Server(10.1.100.5) Nginx 리버스 프록시 설정
# 배치: /etc/nginx/sites-available/ai-craver.conf → sites-enabled 심볼릭 링크
# 검증: nginx -t && systemctl reload nginx
#
# 핵심: 채팅 응답이 SSE(스트리밍)이므로 proxy_buffering off + 긴 read timeout이 필수.
# 이 설정이 빠지면 스트리밍이 뭉텅이로 오거나 중간에 끊긴다.

upstream ai_craver_was {
    server 10.1.150.5:3000;
    keepalive 32;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name ai.craver.local;   # 사내 DNS 확정 후 변경
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.craver.local;   # 사내 DNS 확정 후 변경

    # 사내 SSL 인증서 (발급 후 경로 교체)
    ssl_certificate     /etc/nginx/ssl/ai-craver.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-craver.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;   # 이미지 업로드(얼굴검색 등) 대비

    # 정적 파일을 Web 서버에서 직접 서빙하려면 아래 주석 해제 후
    # app/static, app/frontend를 Web 서버로 rsync. (1차 이관에서는 WAS 프록시로 충분)
    # location /static/ {
    #     alias /srv/ai-craver/static/;
    #     expires 7d;
    # }

    location / {
        proxy_pass http://ai_craver_was;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 앱이 리다이렉트·쿠키·chart_base_url 자동감지에 사용
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ── SSE 스트리밍 필수 설정 ──
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;   # 긴 LLM 응답 대기
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }
}

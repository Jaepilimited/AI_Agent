# AI Craver — Web Server(10.1.100.5) Nginx : 도메인·SSL 발급 전 임시 HTTP 설정
#
# 사내 도메인과 SSL 인증서가 나오기 전까지 IP(10.1.100.5)로 접속해 검증하는 용도다.
# 인증서 발급 후에는 deploy/nginx-ai-craver.conf(HTTPS 버전)로 교체할 것.
#
# 배치:
#   sudo cp deploy/nginx-ai-craver-http.conf /etc/nginx/sites-available/ai-craver.conf
#   sudo ln -sf /etc/nginx/sites-available/ai-craver.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 핵심: 채팅 응답이 SSE(스트리밍)이므로 proxy_buffering off + 긴 read timeout이 필수.
# 이 설정이 빠지면 스트리밍이 뭉텅이로 오거나 중간에 끊긴다.

upstream ai_craver_was {
    server 10.1.150.5:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://ai_craver_was;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ── SSE 스트리밍 필수 설정 ──
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }
}
